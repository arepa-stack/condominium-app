<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Apto Condominios</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#F3F1ED">
    <meta name="color-scheme" content="light">
    <meta name="google" content="notranslate">
    <meta name="description" content="Gestiona tu condominio: pagos, facturas, votaciones y anuncios.">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #F3F1ED; font-family: system-ui, sans-serif; }
        #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #555; }
        #loading img { width: 96px; height: 96px; border-radius: 22px; }
    </style>
</head>
<body>
<noscript>
    <style>#loading { display: none; }</style>
    <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;color:#555;background:#F3F1ED">
        <span>Apto Condominios necesita JavaScript. Actívalo para continuar.</span>
        <span>Apto Condominios needs JavaScript. Enable it to continue.</span>
    </div>
</noscript>
<div id="loading">
    <img src="icon-192.png" alt="">
    <span id="loading-text">Cargando…</span>
</div>
<script>
    // The app follows the browser language (es default, en); keep the shell (lang, loading text) in sync.
    const isEn = /^en\b/i.test(navigator.language || '');
    if (isEn) {
        document.documentElement.lang = 'en';
        document.getElementById('loading-text').textContent = 'Loading…';
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

    // Compose for Web types into a hidden <input> it creates per focused field. For password fields it only sets
    // inputmode="password" (ignored by browsers) and autocorrect="on", so mobile keyboards treat the password as
    // plain text: they suggest it and may learn it. Make that backing input a real password input.
    // The input lives in the body's shadow root, is created on focus and gets its attributes afterwards, so watch
    // that shadow root for new inputs / inputmode changes instead of listening to focus.
    // ponytail: relies on Compose's backing-input markup; drop once Compose sets type=password itself.
    const fixPasswordInput = el => {
        if (el instanceof HTMLInputElement && el.getAttribute('inputmode') === 'password' && el.type !== 'password') {
            el.type = 'password';
            el.setAttribute('autocorrect', 'off');
            el.setAttribute('autocomplete', 'current-password');
        }
    };
    const shadowWait = setInterval(() => {
        const root = document.body.shadowRoot;
        if (!root) return;
        clearInterval(shadowWait);
        new MutationObserver(records => records.forEach(r => {
            if (r.type === 'attributes') fixPasswordInput(r.target);
            r.addedNodes.forEach(n => {
                fixPasswordInput(n);
                if (n.querySelectorAll) n.querySelectorAll('input').forEach(fixPasswordInput);
            });
        })).observe(root, { subtree: true, childList: true, attributes: true, attributeFilter: ['inputmode'] });
    }, 200);

    // A failed boot used to leave a blank/black screen with no clue (seen on a Huawei Y7p): show the reason on top
    // so the resident can send a photo of it. Once the app drew its first frame, errors stay in the console only.
    let booted = false;
    const showError = detail => {
        if (booted || document.getElementById('boot-error')) return;
        const box = document.createElement('div');
        box.id = 'boot-error';
        box.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;' +
            'justify-content:center;gap:12px;padding:24px;text-align:center;color:#555;background:#F3F1ED;font-family:system-ui,sans-serif';
        const title = document.createElement('span');
        title.textContent = isEn
            ? 'The app could not start on this browser. Try Chrome or Firefox up to date.'
            : 'La app no pudo iniciar en este navegador. Prueba con Chrome o Firefox actualizados.';
        const info = document.createElement('code');
        info.style.cssText = 'font-size:12px;color:#8a7f72;word-break:break-word;max-width:520px';
        info.textContent = String(detail).slice(0, 300) + ' · ' + navigator.userAgent;
        box.append(title, info);
        document.body.appendChild(box);
    };
    window.addEventListener('error', e => showError(e.message || e.error || 'error'));
    window.addEventListener('unhandledrejection', e => showError((e.reason && (e.reason.message || e.reason)) || 'rejection'));
    // ponytail: "booted" = 5 s after main.kt removes the loading screen (startup errors land in that window); a real
    // first-frame signal from main.kt if this ever hides a late startup error or flags a harmless one.
    new MutationObserver((_, obs) => {
        if (!document.getElementById('loading')) { setTimeout(() => { booted = true; }, 5000); obs.disconnect(); }
    }).observe(document.body, { childList: true });

    // Compose draws on a WebGL canvas: without WebGL it boots into a black screen.
    const probe = document.createElement('canvas');
    const gl = probe.getContext('webgl2') || probe.getContext('webgl');
    const hasWebGl = !!gl;
    const lose = gl && gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext(); // give the probe's context back, browsers cap them

    // Smallest module using a WasmGC type: Kotlin/Wasm needs WasmGC (Chrome 119+, Firefox 120+, Safari 18.2+).
    const wasmGc = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]);
    if (WebAssembly.validate(wasmGc) && !hasWebGl) {
        showError('WebGL unavailable');
    } else if (WebAssembly.validate(wasmGc)) {
        // Compose keeps its own resource cache (strings/images) with no versioning: after a deploy it
        // would read new string offsets from the old strings file → blank texts. Drop it before booting.
        // ponytail: re-downloads resources (~hundreds of KB) every load; key it by build id if that matters.
        const boot = () => {
            const s = document.createElement('script');
            s.src = 'shared.js';
            s.onerror = () => showError('shared.js failed to load');
            document.body.appendChild(s);
        };
        ('caches' in window ? caches.delete('compose_web_resources_cache').catch(() => {}) : Promise.resolve()).then(boot);
    } else {
        document.getElementById('loading-text').textContent = isEn
            ? 'Your browser is not supported. Update it (Chrome, Firefox or Safari 18.2+).'
            : 'Tu navegador no es compatible. Actualízalo (Chrome, Firefox o Safari 18.2+).';
    }
</script>
</body>
</html>
