# JVM Arguments for Gradle and Kotlin Daemon
org.gradle.jvmargs=-Xmx4096m -Xss8m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m -Xss8m

# Android Settings
android.useAndroidX=true
android.enableJetifier=false

# KMP Settings
kotlin.mpp.androidSourceSetLayoutVersion=2
org.jetbrains.compose.experimental.jsoverwasm.enabled=true
kotlin.native.ignoreDisabledTargets=true
android.suppressUnsupportedCompileSdk=36

# Kotlin/Wasm: use npm instead of yarn (a global ~/.yarnrc may point to Yarn Berry, which KGP does not support)
kotlin.js.yarn=false
