# Builds the web (Kotlin/Wasm) version and deploys it to Vercel.
#   push to `dev`  → DEV  (beta API)       GitHub Environment "dev"
#   push to `main` → PROD (production API) GitHub Environment "prod"
# Vercel only hosts the static output: the Gradle build (JDK 21, ~4 GB RAM) runs here.
#
# Each GitHub Environment (Settings → Environments) needs:
#   secrets.VERCEL_TOKEN       Vercel access token
#   secrets.VERCEL_ORG_ID      from .vercel/project.json after `vercel link`
#   secrets.VERCEL_PROJECT_ID  one Vercel project per environment (e.g. apto-web-dev / apto-web)
#   vars.API_URL               DEV: https://condominium-api-beta.nibs-tech.com/  PROD: https://condominium-api.nibs-tech.com/
name: Deploy web

on:
  push:
    branches: [dev, main]
  workflow_dispatch: # manual run; the selected branch decides the environment

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      API_ENV: ${{ github.ref_name == 'main' && 'PROD' || 'DEV' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains # gradle/gradle-daemon-jvm.properties pins a JetBrains JDK 21
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web distribution (${{ env.API_ENV }})
        env:
          DEV_API_URL: ${{ vars.API_URL }}
          PROD_API_URL: ${{ vars.API_URL }}
        run: ./gradlew :shared:wasmJsBrowserDistribution -PapiEnv=${{ env.API_ENV }} --no-configuration-cache

      - name: Verify API target
        run: |
          cat shared/build/generated/apiConfig/com/example/condominio/ApiConfig.kt
          grep -q "ENV = \"${API_ENV}\"" shared/build/generated/apiConfig/com/example/condominio/ApiConfig.kt

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: shared/build/dist/wasmJs/productionExecutable
        run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
